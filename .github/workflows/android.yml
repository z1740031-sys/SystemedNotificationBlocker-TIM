name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          URL="https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          curl -fsSL -o cmdline-tools.zip "$URL"
          unzip -q cmdline-tools.zip -d "$SDK/cmdline-tools-tmp"
          mv "$SDK/cmdline-tools-tmp/cmdline-tools" "$SDK/cmdline-tools/latest"
          rm -rf "$SDK/cmdline-tools-tmp" "$SDK/cmdline-tools.zip"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"           >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          # 注意：Android 17 的平台包带次版本号（android-37.0），不存在 android-37
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0"

      - name: Show environment
        run: |
          java -version
          sdkmanager --list_installed | head -20

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"
            -Dorg.gradle.parallel=true
        run: |
          set -e
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            echo "$RELEASE_SIGNING_KEY" | base64 --decode > keystore.jks
          else
            # 无秘钥时留空文件，build.gradle.kts 会回退到 debug 签名
            touch keystore.jks
          fi
          ./gradlew assembleArm64Minsdk35Release --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64Minsdk35
          path: app/build/outputs/apk/arm64Minsdk35/release/*.apk
          if-no-files-found: error

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/arm64Minsdk35/release/*.apk
